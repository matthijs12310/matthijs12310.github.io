version: 2.1

# 1. Use the Windows Orb to simplify setup
orbs:
  win: circleci/windows@5.0.0 # Use the latest stable version

jobs:
  run-rpa-windows:
    # 2. Specify the Windows executor
    executor:
      name: win/server-2022
      size: "medium" # 2 vCPU, 4GB RAM (standard)

    steps:
      - checkout
      
      - run:
          name: "Verify Windows Environment"
          command: |
            Write-Host "Running on Windows Server 2022"
            $PSVersionTable.PSVersion

      - run:
          name: "Example: Launch UI.Vision Macro"
          command: |
            # Start Chrome with your macro via URL API
            # Note: Chrome is pre-installed on CircleCI Windows images
            Start-Process "chrome.exe" -ArgumentList "--no-sandbox", "chrome-extension://gcbalfbdmfieckjlnblleoemohcganoc/ui-vision.html?macro=MyMacro&direct=1"

# 3. Define the workflow
workflows:
  test-workflow:
    jobs:
      - run-rpa-windows