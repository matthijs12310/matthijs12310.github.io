name: machine.dev SSH shell

on:
  workflow_dispatch:
    inputs:
      keepalive_minutes:
        description: "How long to keep the runner alive"
        required: true
        default: "120"

jobs:
  ssh:
    runs-on:
      - machine
      - gpu=t4
      - regions=eu-south-2
      - tenancy=spot
      - disk_size=100
    timeout-minutes: 360

    steps:
      - name: Start Tailscale SSH
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          HOSTNAME: machine-dev-ssh-${{ github.run_id }}
        run: |
          set -eux

          if [ -z "${TAILSCALE_AUTHKEY:-}" ]; then
            echo "Missing repo secret: TAILSCALE_AUTHKEY"
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates openssh-server
          sudo mkdir -p /run/sshd
          sudo systemctl start ssh || sudo /usr/sbin/sshd

          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscaled --state=/tmp/tailscaled.state --socket=/tmp/tailscaled.sock >/tmp/tailscaled.log 2>&1 &
          sleep 3

          sudo tailscale --socket=/tmp/tailscaled.sock up \
            --auth-key="${TAILSCALE_AUTHKEY}" \
            --hostname="${HOSTNAME}" \
            --ssh=true

          echo
          echo "SSH ready:"
          echo "  tailscale ssh runner@${HOSTNAME}"
          echo
          echo "GPU check:"
          nvidia-smi || true
          ls -la /dev/dri 2>/dev/null || true

      - name: Keep SSH alive
        run: |
          minutes='${{ github.event.inputs.keepalive_minutes }}'
          case "$minutes" in
            ''|*[!0-9]*) minutes=120 ;;
          esac
          if [ "$minutes" -gt 350 ]; then minutes=350; fi
          echo "Keeping SSH alive for ${minutes} minutes"
          sleep "$((minutes * 60))"
