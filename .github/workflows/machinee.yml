name: machine.dev SSH shell

on:
  workflow_dispatch:
    inputs:
      keepalive_minutes:
        description: "How long to keep the runner alive"
        required: true
        default: "120"

jobs:
  ssh:
    runs-on:
      - machine
      - gpu=l4
      - regions=eu-south-2
      - tenancy=on_demand
      - disk_size=100
    timeout-minutes: 360

    steps:
      - name: Start Tailscale SSH
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          HOSTNAME: machine-dev-l4-eu
        run: |
          set -eux

          if [ -z "${TAILSCALE_AUTHKEY:-}" ]; then
            echo "Missing repo secret: TAILSCALE_AUTHKEY"
            exit 1
          fi
          if [ -z "${SSH_PUBLIC_KEY:-}" ]; then
            echo "Missing repo secret: SSH_PUBLIC_KEY"
            echo "Create one with the contents of your ~/.ssh/id_ed25519.pub"
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates openssh-server lsof iproute2 kmod

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "${SSH_PUBLIC_KEY}" > "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"

          sudo mkdir -p /root/.ssh
          sudo chmod 700 /root/.ssh
          printf '%s\n' "${SSH_PUBLIC_KEY}" | sudo tee /root/.ssh/authorized_keys >/dev/null
          sudo chmod 600 /root/.ssh/authorized_keys

          sudo sed -i \
            -e 's/^#\?PubkeyAuthentication .*/PubkeyAuthentication yes/' \
            -e 's/^#\?PasswordAuthentication .*/PasswordAuthentication no/' \
            -e 's/^#\?PermitRootLogin .*/PermitRootLogin prohibit-password/' \
            /etc/ssh/sshd_config
          sudo mkdir -p /run/sshd
          sudo systemctl restart ssh || sudo /usr/sbin/sshd

          curl -fsSL https://tailscale.com/install.sh | sh
          sudo systemctl stop tailscaled 2>/dev/null || true
          sudo pkill -9 tailscaled 2>/dev/null || true
          sudo lsof -n /dev/net/tun || true
          sudo ip link delete tailscale0 2>/dev/null || true
          sudo modprobe tun 2>/dev/null || true
          if [ ! -c /dev/net/tun ]; then
            sudo mkdir -p /dev/net
            sudo mknod /dev/net/tun c 10 200 || true
            sudo chmod 600 /dev/net/tun || true
          fi

          if [ ! -c /dev/net/tun ]; then
            echo "ERROR: /dev/net/tun is not available, cannot use normal Tailscale TUN mode"
            ls -la /dev/net /dev/net/tun 2>/dev/null || true
            exit 1
          fi

          sudo mkdir -p /var/lib/tailscale /run/tailscale
          sudo tailscaled \
            --state=/var/lib/tailscale/tailscaled.state \
            --socket=/run/tailscale/tailscaled.sock \
            >/tmp/tailscaled.log 2>&1 &

          for i in $(seq 1 30); do
            if [ -S /run/tailscale/tailscaled.sock ]; then
              break
            fi
            sleep 1
          done

          if [ ! -S /run/tailscale/tailscaled.sock ]; then
            echo "ERROR: tailscaled did not create /run/tailscale/tailscaled.sock"
            ps aux | grep '[t]ailscaled' || true
            ls -la /run/tailscale /var/lib/tailscale /dev/net /dev/net/tun 2>/dev/null || true
            cat /tmp/tailscaled.log || true
            exit 1
          fi

          if ! sudo tailscale --socket=/run/tailscale/tailscaled.sock up \
            --auth-key="${TAILSCALE_AUTHKEY}" \
            --hostname="${HOSTNAME}" \
            --ssh=false; then
            echo "ERROR: tailscale up failed"
            sudo tailscale --socket=/run/tailscale/tailscaled.sock status || true
            ip addr || true
            cat /tmp/tailscaled.log || true
            exit 1
          fi

          if ! ip link show tailscale0 >/dev/null 2>&1; then
            echo "ERROR: tailscale0 was not created after tailscale up"
            sudo tailscale --socket=/run/tailscale/tailscaled.sock status || true
            ip addr || true
            cat /tmp/tailscaled.log || true
            exit 1
          fi

          echo
          echo "SSH ready:"
          echo "  ssh runner@$(sudo tailscale --socket=/run/tailscale/tailscaled.sock ip -4)"
          echo "  ssh root@$(sudo tailscale --socket=/run/tailscale/tailscaled.sock ip -4)"
          echo
          echo "Or by hostname if MagicDNS works:"
          echo "  ssh runner@${HOSTNAME}"
          echo "  ssh root@${HOSTNAME}"
          echo
          echo "GPU check:"
          nvidia-smi || true
          ls -la /dev/dri 2>/dev/null || true

      - name: Keep SSH alive
        run: |
          minutes='${{ github.event.inputs.keepalive_minutes }}'
          case "$minutes" in
            ''|*[!0-9]*) minutes=120 ;;
          esac
          if [ "$minutes" -gt 350 ]; then minutes=350; fi
          echo "Keeping SSH alive for ${minutes} minutes"
          sleep "$((minutes * 60))"
